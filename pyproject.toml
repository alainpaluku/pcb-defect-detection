[project]
name = "pcb-defect-detection"
version = "3.0.0"
description = "PCB defect detection with YOLO11, Gradio and a desktop interface"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
